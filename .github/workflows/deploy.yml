name: Deploy

# Single admin AWS account: one GitHub Environment, one label.
#
# Setup (one-time, outside this repo):
#   1. Create GitHub Environment: admin
#      - Optional: enable required reviewers for production safety
#   2. Add secret AWS_ROLE_ARN to that environment (OIDC role in the admin account)
#   3. IAM OIDC trust for that role, e.g.:
#        "token.actions.githubusercontent.com:sub":
#          "repo:<org>/<repo>:environment:admin"
#
# Add PR label `deploy:admin` on an open pull request to deploy.
# See README.md for details.

on:
  pull_request:
    types: [labeled]

concurrency:
  group: deploy-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  deploy-admin:
    name: Deploy → admin
    if: github.event.label.name == 'deploy:admin'
    runs-on: ubuntu-latest
    environment: admin
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: ./.github/actions/setup-env

      - name: Deploy SST → admin
        run: pnpm exec sst deploy --stage admin
